[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cleansheet-reports"
version = "0.1.0"
description = "Local CSV and Excel cleaning with audit logs, quality scoring, PII pattern scans, and analytics reports."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "xxlm47" }]
dependencies = ["pandas>=2.0", "numpy>=1.23", "matplotlib>=3.6", "seaborn>=0.12", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4"]

[project.scripts]
cleansheet = "cleansheet.cli:main"

[project.urls]
Homepage = "https://github.com/xxlm47/cleansheet-reports"

[tool.setuptools.packages.find]
include = ["cleansheet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
